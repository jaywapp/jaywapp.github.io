<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>박준영 | 문서 D 색 기둥</title>
  <link rel="stylesheet" href="../../career-site/shared/base.css">
  <link rel="stylesheet" href="../shared/doc.css">
  <link rel="stylesheet" href="style.css">
  <script src="../shared/concepts.js"></script>
  <script src="../../career-site/shared/review.js"></script>
</head>
<body>
  <!-- Document variant D: identity and reference facts live in a fixed cobalt column; the career reads beside it. -->
  <a class="skip" href="#experience">경력으로 건너뛰기</a>
  <div class="split">
    <aside class="col" aria-label="이름과 기본 정보">
      <div class="col-id">
        <h1><span id="name-ko"></span><span class="col-en" id="name-en"></span></h1>
        <p class="role" id="role"></p>
      </div>
      <section><h2>연락처</h2><ul class="contact" id="contact"></ul></section>
      <section><h2>기술</h2><dl class="kv" id="skills"></dl></section>
      <section><h2>학력</h2><div id="education"></div></section>
      <section><h2>자격</h2><div id="certs"></div></section>
      <button type="button" class="print" data-print><i class="ph ph-printer" aria-hidden="true"></i> PDF로 저장</button>
    </aside>

    <main class="read">
      <section class="lead">
        <p class="statement" id="statement"></p>
        <p id="about"></p>
        <p class="facts" id="facts"></p>
      </section>

      <section id="experience" aria-labelledby="exp-title">
        <h2 class="part" id="exp-title">경력</h2>
        <div id="jobs"></div>
      </section>

      <section aria-labelledby="side-title">
        <h2 class="part" id="side-title">개인 프로젝트</h2>
        <ul class="sides" id="side"></ul>
      </section>
      <footer class="foot"><p>© 2026 Junyoung Park</p></footer>
    </main>
  </div>

  <script src="../../career-site/shared/data.js"></script>
  <script src="../shared/doc.js"></script>
  <script>
    (function () {
      const C = window.CAREER, D = window.DOC, esc = C.esc;
      const VISIBLE = 5;
      D.fillCommon();
      D.text('name-ko', C.profile.name);
      D.text('name-en', C.profile.nameEn);
      D.set('jobs', C.companies.map((co) => {
        const first = co.projects.slice(0, VISIBLE), rest = co.projects.slice(VISIBLE);
        return '<article class="job"><p class="date">' + esc(co.period) + '<span>' + D.duration(co) + '</span></p><h3>' + esc(co.name) + '</h3>' +
          '<p class="job-role">' + esc(co.role) + '</p><p class="job-desc">' + esc(co.description) + '</p>' +
          (first.length ? D.works(first) : '') +
          (rest.length ? '<details class="more"><summary><i class="ph ph-plus" aria-hidden="true"></i> 작업 ' + rest.length + '개 더 보기</summary>' + D.works(rest) + '</details>' : '') +
          '</article>';
      }).join(''));
    })();
  </script>
</body>
</html>

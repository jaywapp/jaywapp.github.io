<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>박준영 | 홈 M 명함</title>
  <link rel="stylesheet" href="../../career-site/shared/base.css">
  <link rel="stylesheet" href="../../career-site-simple/shared/simple.css">
  <link rel="stylesheet" href="../shared/home.css">
  <script src="../shared/home.js"></script>
  <script src="../../career-site/shared/review.js"></script>
  <style>
    /* M: a calling card first, then two columns side by side: what I made and what I wrote. */
    .card { min-height: 82dvh; display: grid; align-content: center; max-width: 1120px; margin: 0 auto; padding: 48px 40px; }
    h1 { font-size: clamp(3rem, 9vw, 6rem); font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; }
    .role { margin-top: 16px; font-size: clamp(1.125rem, 2.2vw, 1.5rem); font-weight: 600; color: var(--cobalt); }
    .intro { display: grid; gap: 10px; margin-top: 28px; max-width: 34em; font-size: clamp(1.0625rem, 1.8vw, 1.25rem); color: var(--ink-2); }
    .card .nav { margin-top: 32px; gap: 4px 24px; }
    .card .nav a { min-height: 44px; font-size: 17px; font-weight: 700; }
    .rest { max-width: 1120px; margin: 0 auto; padding: 0 40px 120px; }
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; }
    h2 { padding: 16px 0 14px; font-size: 1rem; font-weight: 800; border-top: 2px solid var(--ink); }
    .resume { margin-top: 72px; }
    .foot { margin-top: 72px; }
    @media (max-width: 819px) {
      .card { min-height: 0; padding: 56px 20px 64px; }
      .rest { padding: 0 20px 96px; }
      .cols { grid-template-columns: 1fr; gap: 56px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#made-title">본문으로 건너뛰기</a>
  <header class="card">
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <div class="intro" id="intro"></div>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="#made-title">만든 것</a>
      <a href="#posts-title">글</a>
      <a href="../../career-site-simple/concept-04/index.html">이력서</a>
      <a href="https://github.com/jaywapp" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="mailto:jaywapp16@gmail.com">이메일</a>
    </nav>
  </header>
  <main class="rest">
    <div class="cols">
      <section>
        <h2 id="made-title">만든 것</h2>
        <ul class="made" id="made"></ul>
      </section>
      <section>
        <h2 id="posts-title">글</h2>
        <ul class="posts" id="posts"></ul>
        <a class="more" href="https://jaywapp.tistory.com/" target="_blank" rel="noopener noreferrer">블로그에서 모두 보기</a>
      </section>
    </div>
    <section class="resume">
      <h2>이력</h2>
      <ul class="career" id="career"></ul>
      <a class="more" href="../../career-site-simple/concept-04/index.html">이력서 전체 보기</a>
    </section>
    <footer class="foot"><p>© 2026 Junyoung Park</p></footer>
  </main>
  <script>window.HOME.fill();</script>
</body>
</html>

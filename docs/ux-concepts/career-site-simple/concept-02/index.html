<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>박준영 | 심플 G 라벨</title>
  <link rel="stylesheet" href="../../career-site/shared/base.css">
  <link rel="stylesheet" href="../shared/simple.css">
  <script src="../shared/concepts.js"></script>
  <script src="../../career-site/shared/review.js"></script>
  <style>
    /* G: every part of the resume is a row. Label at the left, content at the right, one hairline between rows. */
    .page { max-width: 980px; margin: 0 auto; padding: 72px 40px 120px; }
    .row { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 24px; padding: 28px 0; border-top: 1px solid var(--rule); }
    .row:first-child { border-top: 0; padding-top: 0; }
    .label { font-size: 15px; color: var(--ink-2); }
    h1 { font-size: clamp(2.25rem, 5vw, 3.25rem); font-weight: 800; line-height: 1.15; letter-spacing: -0.035em; }
    .role { margin-top: 4px; font-weight: 600; color: var(--cobalt); }
    .row p { max-width: 62ch; }
    .job { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 16px; }
    .job + .job { margin-top: 28px; }
    .job h3 { font-size: 1.1875rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.5; }
    .job-role { color: var(--ink-2); }
    .job .items { margin-top: 8px; }
    .pairs { display: grid; gap: 4px; }
    .pairs li { display: flex; flex-wrap: wrap; gap: 0 12px; }
    .pairs li > span:first-child { min-width: 4.5em; color: var(--ink-2); }
    .foot { margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--rule); }
    @media (max-width: 719px) {
      .page { padding: 36px 20px 96px; }
      .row { grid-template-columns: 1fr; gap: 8px; padding: 24px 0; }
      .row:first-child .label { display: none; }
      .job { grid-template-columns: 1fr; gap: 0; }
    }
    @media print {
      .page { max-width: none; padding: 0; }
      .row { grid-template-columns: 28mm minmax(0, 1fr); gap: 4mm; padding: 4mm 0; }
      h1 { font-size: 22pt; }
      .job { grid-template-columns: 30mm minmax(0, 1fr); gap: 3mm; }
      .job + .job { margin-top: 4mm; }
      .foot { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#experience">경력으로 건너뛰기</a>
  <main class="page">
    <section class="row">
      <p class="label"><button type="button" class="pdf" data-print>PDF로 저장</button></p>
      <div>
        <h1 id="name"></h1>
        <p class="role" id="role"></p>
      </div>
    </section>
    <section class="row"><h2 class="label">소개</h2><p id="summary"></p></section>
    <section class="row" id="experience"><h2 class="label">경력</h2><div id="jobs"></div></section>
    <section class="row"><h2 class="label">기술</h2><p id="skills"></p></section>
    <section class="row"><h2 class="label">학력과 자격</h2><ul class="pairs" id="edu"></ul></section>
    <section class="row"><h2 class="label">개인 프로젝트</h2><ul class="pairs" id="side"></ul></section>
    <section class="row"><h2 class="label">연락처</h2><ul class="pairs" id="links"></ul></section>
    <footer class="foot"><p>© 2026 Junyoung Park</p></footer>
  </main>
  <script src="../../career-site/shared/data.js"></script>
  <script src="../shared/simple.js"></script>
  <script>
    (function () {
      const C = window.CAREER, S = window.SIMPLE, esc = C.esc;
      const set = (id, html) => (document.getElementById(id).innerHTML = html);
      set('name', esc(C.profile.name));
      set('role', esc(C.profile.role));
      set('summary', esc(C.profile.summary));
      set('jobs', C.companies.map((co) =>
        '<article class="job"><p class="date">' + esc(co.period) + '</p><div><h3>' + esc(co.name) + '</h3>' +
        '<p class="job-role">' + esc(co.role) + '</p>' + (co.projects.length ? S.items(co.projects) : '') + '</div></article>').join(''));
      set('skills', S.skillsLine());
      set('edu',
        '<li><span>학력</span><span>' + S.eduLine() + ' <span class="date">' + S.eduPeriod() + '</span></span></li>' +
        '<li><span>자격</span><span>' + S.certLine() + '</span></li>');
      set('side', S.side());
      set('links', S.linksFull());
      S.init();
    })();
  </script>
</body>
</html>

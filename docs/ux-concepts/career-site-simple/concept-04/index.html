<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>박준영 | 심플 I 펼침</title>
  <link rel="stylesheet" href="../../career-site/shared/base.css">
  <link rel="stylesheet" href="../shared/simple.css">
  <script src="../shared/concepts.js"></script>
  <script src="../../career-site/shared/review.js"></script>
  <style>
    /* I: the whole career fits on one screen as four rows. A row opens to show the work done there. */
    .page { max-width: 920px; margin: 0 auto; padding: 72px 40px 120px; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    h1 { font-size: clamp(2.25rem, 5vw, 3rem); font-weight: 800; line-height: 1.15; letter-spacing: -0.035em; }
    .role { margin-top: 4px; font-weight: 600; color: var(--cobalt); }
    .summary { margin-top: 20px; max-width: 60ch; color: var(--ink-2); }
    .links { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 12px; }
    .links a { display: inline-flex; align-items: center; min-height: 40px; }
    .rows { margin-top: 48px; border-top: 2px solid var(--ink); }
    .co { border-bottom: 1px solid var(--rule); }
    .co > summary { display: grid; grid-template-columns: minmax(0, 1fr) auto 24px; gap: 4px 20px; align-items: baseline; padding: 20px 0; cursor: pointer; list-style: none; }
    .co > summary::-webkit-details-marker { display: none; }
    .co h2 { font-size: clamp(1.5rem, 3.4vw, 2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; }
    .co-role { grid-column: 1; color: var(--ink-2); }
    .co > summary .date { grid-row: 1; grid-column: 2; }
    .co > summary > i { grid-row: 1; grid-column: 3; align-self: center; font-size: 20px; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .co[open] > summary > i { transform: rotate(45deg); }
    .co > summary:hover h2 { color: var(--cobalt); }
    .co-body { padding: 0 44px 32px 0; }
    .co-body > p { max-width: 62ch; color: var(--ink-2); }
    .works { display: grid; gap: 20px; margin-top: 20px; }
    .works h3 { font-size: 1.0625rem; font-weight: 700; }
    .works .bul { padding: 4px 0 0; }
    .pairs { display: grid; gap: 4px; }
    .pairs li { display: flex; flex-wrap: wrap; gap: 0 12px; }
    .pairs li > span:first-child { min-width: 4.5em; color: var(--ink-2); }
    .foot { margin-top: 56px; }
    @media (max-width: 599px) {
      .page { padding: 36px 20px 96px; }
      .co > summary { grid-template-columns: minmax(0, 1fr) 24px; }
      .co > summary .date { grid-row: auto; grid-column: 1; }
      .co > summary > i { grid-column: 2; }
      .co-body { padding-right: 0; }
    }
    @media print {
      .page { max-width: none; padding: 0; }
      h1 { font-size: 22pt; }
      .rows { margin-top: 6mm; }
      .co > summary { display: grid !important; grid-template-columns: minmax(0, 1fr) auto; padding: 3mm 0 1mm; }
      .co > summary > i { display: none; }
      .co h2 { font-size: 13pt; }
      .co-body { padding: 0 0 4mm; }
      .works { gap: 3mm; margin-top: 3mm; }
      .works h3 { font-size: 10.5pt; }
      .foot { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#rows">경력으로 건너뛰기</a>
  <div class="page">
    <header>
      <div class="top">
        <div>
          <h1 id="name"></h1>
          <p class="role" id="role"></p>
        </div>
        <button type="button" class="pdf" data-print>PDF로 저장</button>
      </div>
      <p class="summary" id="summary"></p>
      <ul class="links" id="links"></ul>
    </header>
    <main class="rows" id="rows"></main>
    <footer class="foot"><p>© 2026 Junyoung Park</p></footer>
  </div>
  <script src="../../career-site/shared/data.js"></script>
  <script src="../shared/simple.js"></script>
  <script>
    (function () {
      const C = window.CAREER, S = window.SIMPLE, esc = C.esc;
      const set = (id, html) => (document.getElementById(id).innerHTML = html);
      const plus = '<i class="ph ph-plus" aria-hidden="true"></i>';
      set('name', esc(C.profile.name));
      set('role', esc(C.profile.role));
      set('summary', esc(C.profile.summary));
      set('links', S.links());
      const companies = C.companies.map((co) =>
        '<details class="co"><summary><h2>' + esc(co.name) + '</h2><span class="date">' + esc(co.period) + '</span>' + plus +
        '<span class="co-role">' + esc(co.role) + '</span></summary><div class="co-body"><p>' + esc(co.description) + '</p>' +
        (co.projects.length
          ? '<ul class="works">' + co.projects.map((p) => '<li><h3>' + esc(p.title) + '</h3><ul class="bul">' +
            p.bullets.map((b) => '<li>' + esc(b) + '</li>').join('') + '</ul></li>').join('') + '</ul>'
          : '') +
        '</div></details>').join('');
      const basics =
        '<details class="co"><summary><h2>기술, 학력, 자격</h2><span class="date"></span>' + plus + '</summary><div class="co-body"><ul class="pairs">' +
        '<li><span>기술</span><span>' + S.skillsLine() + '</span></li>' +
        '<li><span>학력</span><span>' + S.eduLine() + ' <span class="date">' + S.eduPeriod() + '</span></span></li>' +
        '<li><span>자격</span><span>' + S.certLine() + '</span></li></ul></div></details>';
      const side =
        '<details class="co"><summary><h2>개인 프로젝트</h2><span class="date"></span>' + plus + '</summary><div class="co-body"><ul class="pairs">' +
        S.side() + '</ul></div></details>';
      set('rows', companies + basics + side);
      S.init();
    })();
  </script>
</body>
</html>
